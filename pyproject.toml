[project]
name = "cse291p"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.3",
    "numpy>=1.24.0",
    "intervaltree>=3.1.0",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
    "statsmodels>=0.14.5",
    "selenium>=4.0.0",
    "z3-solver>=4.15.4.0",
    "kiwisolver>=1.4.9",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "rich>=14.2.0",
    "ruff>=0.14.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
scrape-multi-viewport = "cse291p.util.multi_viewport_scraper:main"

[tool.uv]
package = true

[tool.ruff]
lint.select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

